# Construit l'installateur Windows de RTMS et le publie dans une « Release » GitHub,
# téléchargeable en un seul fichier (les releases acceptent les gros fichiers).
# Déclenchement : envoi sur la branche de travail (application ou ce fichier modifiés),
# étiquette « installateur-v* », ou à la main. La release est nommée d'après la version.
name: RTMS installateur Windows
on:
  push:
    branches: [claude/pensive-keller-d1as3i]
    tags: ["installateur-v*"]
    paths: ["rtms/apps/**", ".github/workflows/rtms-installateur.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: rtms/apps/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: npm ci --prefix ../api
      - run: npx prisma generate
        working-directory: rtms/apps/api
      - run: npm ci
      - run: npm run dist:win
      - run: node test/check-build.mjs
      - run: cd dist && sha256sum RTMS-Setup-*.exe RTMS-Portable-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publication de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installateur-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RTMS ${{ steps.v.outputs.version }} — installateur Windows
          make_latest: true
          body: |
            Installateur Windows de RAHA TRANSPORT MANAGEMENT SYSTEM.

            1. Téléchargez **RTMS-Setup-….exe** ci-dessous (rubrique « Assets »).
            2. Double-cliquez dessus. Si Windows affiche « Windows a protégé votre ordinateur » :
               « Informations complémentaires », puis « Exécuter quand même ».
            3. Sur le PC qui garde les données : « Ce poste est le poste principal ».
               Sur les autres : « Se connecter au poste principal ».

            Version portable (sans installation) : RTMS-Portable-….zip, à décompresser
            (clic droit > Extraire tout), puis lancer « RAHA TRANSPORT RTMS.exe ».

            Empreinte SHA-256 : voir SHA256SUMS.txt.
          files: |
            rtms/apps/desktop/dist/RTMS-Setup-*.exe
            rtms/apps/desktop/dist/RTMS-Portable-*.zip
            rtms/apps/desktop/dist/SHA256SUMS.txt
