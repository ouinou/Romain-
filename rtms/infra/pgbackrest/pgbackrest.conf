# pgBackRest — sauvegardes physiques chiffrées + archivage WAL (PITR)
# Planification (cron hôte, voir docs/SAUVEGARDE.md) :
#   complète le dimanche 01:30, différentielle les autres jours 01:30
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass : fourni par variable d'environnement PGBACKREST_REPO1_CIPHER_PASS (Vault)
repo1-retention-full=4
repo1-retention-diff=14
# Deuxième dépôt hors site (S3 compatible) — recommandé
# repo2-type=s3
# repo2-s3-bucket=rtms-backups
# repo2-s3-endpoint=s3.eu-west-3.amazonaws.com
# repo2-s3-region=eu-west-3
# repo2-cipher-type=aes-256-cbc
# repo2-retention-full=8
compress-type=zst
compress-level=3
process-max=2
start-fast=y
log-level-console=info
log-level-file=detail

[rtms]
pg1-path=/var/lib/postgresql/data
