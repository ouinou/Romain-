groups:
  - name: rtms
    rules:
      - alert: RtmsApiIndisponible
        expr: up{job="rtms-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Une instance de l'API RTMS ne répond plus" }
      - alert: RtmsTauxErreurs5xx
        expr: sum(rate(rtms_http_request_duration_seconds_count{status=~"5.."}[5m])) / sum(rate(rtms_http_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Plus de 2 % d'erreurs serveur sur 5 minutes" }
      - alert: RtmsLatenceElevee
        expr: histogram_quantile(0.95, sum by (le) (rate(rtms_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 > 500 ms depuis 10 minutes" }
      - alert: RtmsEchecsConnexionAnormaux
        expr: sum(rate(rtms_auth_events_total{event=~"login_4.."}[5m])) * 60 > 30
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Plus de 30 échecs de connexion par minute (attaque par force brute ?)" }
      - alert: RtmsLicenceInvalide
        expr: rtms_license_valid == 0
        for: 15m
        labels: { severity: critical }
        annotations: { summary: "Licence RTMS invalide : l'application est en consultation seule" }
