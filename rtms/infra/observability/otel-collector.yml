receivers:
  otlp: { protocols: { http: { endpoint: 0.0.0.0:4318 } } }
processors:
  batch: {}
  attributes/scrub:
    actions:
      - { key: http.request.header.cookie, action: delete }
      - { key: http.request.header.authorization, action: delete }
exporters:
  # Remplacer par Tempo / Jaeger / fournisseur choisi
  debug: { verbosity: basic }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [attributes/scrub, batch], exporters: [debug] }
