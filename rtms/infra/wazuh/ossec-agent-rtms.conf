<!-- Extrait à ajouter dans /var/ossec/etc/ossec.conf de l'agent Wazuh installé sur le serveur RTMS -->
<ossec_config>
  <!-- Journaux des conteneurs (API JSON pino, Caddy, PostgreSQL) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
  </localfile>
  <!-- Intégrité des fichiers sensibles -->
  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="no">/etc/rtms</directories>
    <directories check_all="yes" realtime="yes">/opt/rtms/infra</directories>
    <directories check_all="yes">/etc/ssh</directories>
  </syscheck>
  <!-- Inventaire des vulnérabilités système -->
  <vulnerability-detection>
    <enabled>yes</enabled>
  </vulnerability-detection>
</ossec_config>
