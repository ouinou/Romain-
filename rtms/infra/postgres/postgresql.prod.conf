# Extraits de configuration PostgreSQL 16 pour la production RTMS
listen_addresses = '*'                 # réseau Docker interne uniquement (pas de port publié)
ssl = on
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'
max_connections = 100                  # l'API utilise un pool de 10-20 connexions par instance
shared_buffers = 1GB                   # ~25 % de la RAM d'un serveur 4 Go — à ajuster
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
# Journalisation (collectée par Loki/Wazuh)
log_destination = 'stderr'
logging_collector = off
log_connections = on
log_disconnections = on
log_min_duration_statement = 500       # requêtes lentes > 500 ms
log_line_prefix = '%m [%p] %u@%d %r '
log_statement = 'ddl'
# Archivage WAL pour pgBackRest (restauration à un instant donné)
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=rtms archive-push %p'
max_wal_senders = 5                    # réplication en flux possible vers un secondaire
