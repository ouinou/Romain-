<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAHA TRANSPORT | RTMS</title>
<style>
:root{--green:#123f32;--green2:#1e6a50;--orange:#ef8125;--yellow:#f2c94c;--bg:#f3f6f4;--ink:#20312b;--muted:#718078;--line:#e2e9e4;--white:#fff}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:250px;background:var(--green);color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{padding:8px 12px 24px;border-bottom:1px solid #ffffff25;margin-bottom:18px}.brand strong{font-size:20px;letter-spacing:.7px}.brand small{display:block;color:#b9d1c7;margin-top:5px}.navlabel{font-size:10px;color:#9fb9ae;text-transform:uppercase;letter-spacing:1.2px;padding:13px 12px 6px}.nav button{width:100%;text-align:left;border:0;background:transparent;color:#dce9e3;padding:11px 12px;border-radius:8px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff1b;color:#fff}.nav button.active{border-left:3px solid var(--orange)}.main{margin-left:250px;width:calc(100% - 250px)}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:2}.top .crumb{font-weight:650}.user{color:var(--muted);font-size:12px}.content{padding:28px 30px;max-width:1500px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.heading h1{font-size:25px;margin:0;color:var(--green)}.heading p{margin:5px 0 0;color:var(--muted)}.btn{border:0;border-radius:7px;padding:10px 15px;background:var(--orange);color:white;font-weight:650;cursor:pointer}.btn.secondary{background:#eaf1ed;color:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:18px}.card small{color:var(--muted)}.metric{font-size:26px;font-weight:750;color:var(--green);margin-top:8px}.delta{font-size:11px;color:var(--green2);margin-top:4px}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel h3{margin:0 0 15px;font-size:15px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#f9fbf9}td{font-size:13px}.pill{padding:4px 8px;border-radius:20px;background:#e8f4ed;color:#236044;font-size:11px}.pill.orange{background:#fff1e5;color:#a95612}.pill.gray{background:#eef1ef;color:#66736c}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{max-width:330px;flex:1}.field, input,select{border:1px solid #dce5df;border-radius:7px;padding:10px 11px;background:#fff;color:var(--ink)}.empty{padding:35px;text-align:center;color:var(--muted)}.modalbg{position:fixed;inset:0;background:#10251dcc;display:none;align-items:center;justify-content:center;z-index:5;padding:20px}.modal{background:#fff;border-radius:12px;width:min(560px,100%);padding:24px}.modal h2{margin:0 0 18px;color:var(--green)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.form .wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.notice{padding:13px 15px;background:#fff8e6;border:1px solid #f4df9d;border-radius:8px;color:#705a20;margin-bottom:16px;font-size:12px}.bars{display:flex;align-items:end;gap:13px;height:155px;padding:10px 4px 0;border-bottom:1px solid var(--line)}.barcol{flex:1;text-align:center;color:var(--muted);font-size:10px}.bar{background:#2d7659;border-radius:5px 5px 0 0;min-height:5px;margin-bottom:7px}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{background:#f2f6f3;border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--green);cursor:pointer}.foot{color:#98a49d;font-size:11px;padding:25px 2px}@media(max-width:900px){.side{width:205px}.main{margin-left:205px;width:calc(100% - 205px)}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:650px){.side{position:static;width:100%;height:auto}.app{display:block}.nav{display:grid;grid-template-columns:1fr 1fr}.main{margin:0;width:100%}.top{padding:0 16px}.content{padding:20px 14px}.cards{grid-template-columns:1fr 1fr}.heading{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><strong>RAHA TRANSPORT</strong><small>Management System · RTMS</small></div><nav class="nav" id="nav">
<div class="navlabel">Pilotage</div><button class="active" data-page="dashboard">▦ &nbsp; Tableau de bord</button>
<div class="navlabel">Opérations</div><button data-page="transport">⇄ &nbsp; Transport</button><button data-page="transit">▤ &nbsp; Transit</button><button data-page="importexport">⇅ &nbsp; Import / Export</button><button data-page="commerce">▣ &nbsp; Commerce & stocks</button>
<div class="navlabel">Ressources</div><button data-page="clients">♙ &nbsp; Clients & fournisseurs</button><button data-page="fleet">▰ &nbsp; Parc automobile</button><button data-page="staff">♧ &nbsp; Personnel</button><button data-page="maintenance">⚙ &nbsp; Maintenance</button>
<div class="navlabel">Gestion</div><button data-page="invoices">▧ &nbsp; Facturation</button><button data-page="finance">◈ &nbsp; Finance & trésorerie</button><button data-page="documents">▣ &nbsp; Documents</button><button data-page="reports">▥ &nbsp; Rapports</button><button data-page="settings">⚙ &nbsp; Paramètres</button></nav></aside>
<main class="main"><header class="top"><div class="crumb" id="crumb">Tableau de bord</div><div class="user">Espace de gestion &nbsp;·&nbsp; Administrateur</div></header><section class="content" id="view"></section></main></div>
<div class="modalbg" id="modalbg"><div class="modal"><h2 id="modtitle">Nouvel élément</h2><form id="recordform"><div class="form" id="formfields"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Annuler</button><button class="btn">Enregistrer</button></div></form></div></div>
<script>
const titles={dashboard:'Tableau de bord',transport:'Gestion du transport',transit:'Gestion du transit',importexport:'Importation et exportation',commerce:'Commerce général & stocks',clients:'Clients & fournisseurs',fleet:'Parc automobile',staff:'Personnel & chauffeurs',maintenance:'Maintenance',invoices:'Facturation',finance:'Finance & trésorerie',documents:'Gestion documentaire',reports:'Rapports & statistiques',settings:'Paramètres généraux'};
const configs={transport:{desc:'Planifiez les missions et suivez leur exécution.',button:'Nouvelle mission',fields:['Référence mission','Client','Départ','Destination','Marchandise','Véhicule','Chauffeur','Date de départ','Statut'],cols:['Référence','Client','Trajet','Marchandise','Véhicule','Date','Statut']},transit:{desc:'Centralisez les dossiers et formalités de transit.',button:'Nouveau dossier',fields:['Référence dossier','Client','Origine','Destination','Type de procédure','Date ouverture','Frais estimés','Statut'],cols:['Référence','Client','Origine → destination','Procédure','Ouverture','Frais','Statut']},importexport:{desc:'Suivez les opérations commerciales internationales.',button:'Nouvelle opération',fields:['Référence','Type (Import/Export)','Client / fournisseur','Pays d’origine','Pays de destination','Marchandise','Valeur déclarée','Date','Statut'],cols:['Référence','Type','Partenaire','Pays','Marchandise','Valeur','Statut']},commerce:{desc:'Gérez les articles, achats, ventes et mouvements de stock.',button:'Ajouter un article',fields:['Code article','Désignation','Catégorie','Unité','Quantité en stock','Prix d’achat','Prix de vente','Stock minimum'],cols:['Code','Désignation','Catégorie','Stock','Prix achat','Prix vente']},clients:{desc:'Répertoire central des clients et fournisseurs.',button:'Ajouter un contact',fields:['Type (Client/Fournisseur)','Nom / raison sociale','Téléphone','E-mail','Adresse','N° contribuable','Personne à contacter'],cols:['Type','Nom / raison sociale','Téléphone','E-mail','Adresse']},fleet:{desc:'Suivez les véhicules, leurs documents et leur disponibilité.',button:'Ajouter un véhicule',fields:['Immatriculation','Marque / modèle','Type','Année','Kilométrage','Capacité','Assurance valide jusqu’au','Statut'],cols:['Immatriculation','Véhicule','Type','Kilométrage','Assurance','Statut']},staff:{desc:'Gérez les chauffeurs et les collaborateurs.',button:'Ajouter un employé',fields:['Matricule','Nom complet','Fonction','Téléphone','Permis / qualification','Date d’embauche','Statut'],cols:['Matricule','Nom','Fonction','Téléphone','Qualification','Statut']},maintenance:{desc:'Planifiez les entretiens et conservez l’historique des réparations.',button:'Nouvelle intervention',fields:['Véhicule','Type d’intervention','Description','Prestataire','Date','Coût (FCFA)','Prochain entretien'],cols:['Véhicule','Intervention','Description','Prestataire','Date','Coût']},invoices:{desc:'Créez, imprimez et archivez les factures de RAHA TRANSPORT.',button:'Créer une facture',fields:['Numéro de facture','Client','Date','Désignation','Quantité','Prix unitaire (FCFA)','Taxe (%)','Échéance','Statut'],cols:['N° facture','Client','Date','Désignation','Total TTC','Échéance','Statut']},finance:{desc:'Enregistrez les mouvements et suivez la trésorerie.',button:'Nouveau mouvement',fields:['Type (Recette/Dépense)','Libellé','Catégorie','Montant (FCFA)','Mode de paiement','Date','Référence'],cols:['Type','Libellé','Catégorie','Montant','Paiement','Date']},documents:{desc:'Référencez et classez les pièces administratives et opérationnelles.',button:'Ajouter un document',fields:['Référence','Intitulé','Catégorie','Dossier lié','Date du document','Date d’expiration','Emplacement / lien'],cols:['Référence','Intitulé','Catégorie','Dossier lié','Date','Expiration']}};
let data=JSON.parse(localStorage.getItem('rtms_data')||'{}');function save(){localStorage.setItem('rtms_data',JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(page){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=titles[page];page==='dashboard'?dashboard():page==='reports'?reports():page==='settings'?settings():renderModule(page)}document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function dashboard(){let count=k=>(data[k]||[]).length;let total=(data.finance||[]).reduce((s,r)=>s+(Number(r['Montant (FCFA)'])||0)*(r['Type (Recette/Dépense)']==='Dépense'?-1:1),0);document.getElementById('view').innerHTML=`<div class="heading"><div><h1>Tableau de bord</h1><p>Vue synthétique des activités de RAHA TRANSPORT.</p></div><button class="btn" onclick="go('transport')">+ Nouvelle mission</button></div><div class="cards"><div class="card"><small>Missions enregistrées</small><div class="metric">${count('transport')}</div><div class="delta">Transport</div></div><div class="card"><small>Dossiers de transit</small><div class="metric">${count('transit')}</div><div class="delta">Transit & douane</div></div><div class="card"><small>Factures créées</small><div class="metric">${count('invoices')}</div><div class="delta">Facturation</div></div><div class="card"><small>Contacts enregistrés</small><div class="metric">${count('clients')}</div><div class="delta">Clients & fournisseurs</div></div></div><div class="grid2"><div class="panel"><h3>Activité opérationnelle</h3><div class="bars">${[['Transport',count('transport')],['Transit',count('transit')],['Import/Export',count('importexport')],['Factures',count('invoices')],['Véhicules',count('fleet')]].map(([n,v])=>`<div class="barcol"><div class="bar" style="height:${Math.max(5,Math.min(120,v*18))}px"></div>${n}<br>${v}</div>`).join('')}</div><p style="color:var(--muted);font-size:11px">Les indicateurs se mettent à jour à partir des données saisies dans les modules.</p></div><div class="panel"><h3>Accès rapide</h3><div class="quick"><button onclick="go('invoices')">Créer une facture</button><button onclick="go('transit')">Ouvrir un dossier transit</button><button onclick="go('fleet')">Ajouter un véhicule</button><button onclick="go('clients')">Enregistrer un client</button></div><div class="notice" style="margin-top:18px">Prototype de travail : les données saisies sont conservées dans le navigateur de cet ordinateur. La synchronisation serveur et les comptes utilisateurs seront ajoutés dans la phase backend.</div></div></div><div class="foot">RAHA TRANSPORT MANAGEMENT SYSTEM · Version prototype</div>`}
function renderModule(key){let c=configs[key],rows=data[key]||[];document.getElementById('view').innerHTML=`<div class="heading"><div><h1>${titles[key]}</h1><p>${c.desc}</p></div><button class="btn" onclick="openModal('${key}')">+ ${c.button}</button></div>${key==='invoices'?'<div class="notice">Le modèle graphique exact de la facture RAHA devra être calqué sur la facture originale fournie et validé avant impression officielle.</div>':''}<div class="toolbar"><input id="search" placeholder="Rechercher dans les enregistrements…" oninput="filterRows('${key}')"><button class="btn secondary" onclick="exportCSV('${key}')">Exporter CSV</button></div><div class="tablewrap"><table><thead><tr>${c.cols.map(x=>`<th>${x}</th>`).join('')}<th>Action</th></tr></thead><tbody id="tbody">${tableRows(key,rows)}</tbody></table></div><div class="foot">${rows.length} enregistrement(s) · Les données sont stockées localement dans ce prototype.</div>`}
function tableRows(key,rows){let c=configs[key];if(!rows.length)return `<tr><td colspan="${c.cols.length+1}" class="empty">Aucun enregistrement. Cliquez sur « ${c.button} » pour commencer.</td></tr>`;return rows.map((r,i)=>{let vals=Object.values(r);let cells=c.cols.map((col,j)=>{let v=r[col]??vals[j]??'—';if(String(col).toLowerCase().includes('statut'))return `<td><span class="pill">${esc(v)}</span></td>`;return `<td>${esc(v)}</td>`}).join('');return `<tr>${cells}<td><button class="btn secondary" style="padding:5px 9px" onclick="removeRow('${key}',${i})">Supprimer</button></td></tr>`}).join('')}
function filterRows(k){let q=document.getElementById('search').value.toLowerCase();let rows=(data[k]||[]).filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));document.getElementById('tbody').innerHTML=tableRows(k,rows)}
function openModal(k){let c=configs[k];document.getElementById('modtitle').textContent=c.button;document.getElementById('formfields').innerHTML=c.fields.map((f,i)=>`<label class="${i===0?'wide':''}">${f}<input name="${esc(f)}" ${/date/i.test(f)?'type="date"':''} ${/quantité|prix|montant|coût|valeur|kilométrage|capacité|taxe|stock/i.test(f)?'type="number" step="any"':''} required></label>`).join('');document.getElementById('recordform').dataset.key=k;document.getElementById('modalbg').style.display='flex'}function closeModal(){document.getElementById('modalbg').style.display='none'}document.getElementById('recordform').addEventListener('submit',e=>{e.preventDefault();let k=e.target.dataset.key;let r=Object.fromEntries(new FormData(e.target).entries());(data[k]??=[]).unshift(r);save();closeModal();renderModule(k)});function removeRow(k,i){if(confirm('Supprimer cet enregistrement ?')){data[k].splice(i,1);save();renderModule(k)}}function exportCSV(k){let rows=data[k]||[];if(!rows.length){alert('Aucune donnée à exporter.');return}let keys=configs[k].fields;let csv=[keys.join(';'),...rows.map(r=>keys.map(x=>'"'+String(r[x]??'').replace(/"/g,'""')+'"').join(';'))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='raha_'+k+'.csv';a.click();URL.revokeObjectURL(a.href)}
function reports(){let f=data.finance||[];let rec=f.filter(r=>r['Type (Recette/Dépense)']==='Recette').reduce((s,r)=>s+(+r['Montant (FCFA)']||0),0),dep=f.filter(r=>r['Type (Recette/Dépense)']==='Dépense').reduce((s,r)=>s+(+r['Montant (FCFA)']||0),0);document.getElementById('view').innerHTML=`<div class="heading"><div><h1>Rapports & statistiques</h1><p>Indicateurs calculés à partir des données actuellement enregistrées.</p></div><button class="btn secondary" onclick="window.print()">Imprimer le rapport</button></div><div class="cards"><div class="card"><small>Recettes enregistrées</small><div class="metric">${rec.toLocaleString('fr-FR')} F</div></div><div class="card"><small>Dépenses enregistrées</small><div class="metric">${dep.toLocaleString('fr-FR')} F</div></div><div class="card"><small>Solde net enregistré</small><div class="metric">${(rec-dep).toLocaleString('fr-FR')} F</div></div><div class="card"><small>Opérations transport</small><div class="metric">${(data.transport||[]).length}</div></div></div><div class="panel"><h3>Volumes par activité</h3>${Object.entries({Transport:'transport',Transit:'transit','Import / Export':'importexport',Commerce:'commerce',Facturation:'invoices',Véhicules:'fleet'}).map(([n,k])=>`<p style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:9px 0"><span>${n}</span><strong>${(data[k]||[]).length}</strong></p>`).join('')}</div>`}
function settings(){document.getElementById('view').innerHTML=`<div class="heading"><div><h1>Paramètres généraux</h1><p>Configuration de l'environnement RAHA TRANSPORT.</p></div></div><div class="panel"><h3>Informations de l'entreprise</h3><div class="form"><label class="wide">Raison sociale<input value="RAHA TRANSPORT"></label><label>Téléphone<input placeholder="Téléphone de l'entreprise"></label><label>E-mail<input placeholder="Adresse e-mail"></label><label class="wide">Adresse<input placeholder="Adresse du siège"></label><label>Devise principale<select><option>FCFA</option><option>EUR</option><option>USD</option></select></label><label>Langue<select><option>Français</option><option>English</option></select></label></div><div class="actions"><button class="btn" onclick="alert('Dans cette version prototype, les paramètres ne sont pas encore reliés au serveur.')">Enregistrer les paramètres</button></div></div><div class="notice" style="margin-top:16px">La gestion des utilisateurs, les permissions avancées, les sauvegardes serveur et la synchronisation multi-postes nécessitent la mise en place du backend et de la base PostgreSQL.</div>`}
go('dashboard');
</script></body></html>
