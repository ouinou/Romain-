# Espace de publication du site ITI : https://incubateurtech.tech/admin
# Chaque publication enregistre l'article dans le dépôt GitHub ouinou/Romain-
# puis le site se met à jour tout seul en 1 à 2 minutes.

backend:
  name: github
  repo: ouinou/Romain-
  branch: main
  commit_messages:
    create: "Nouvel article : {{slug}}"
    update: "Mise à jour de l'article : {{slug}}"
    delete: "Suppression de l'article : {{slug}}"
    uploadMedia: "Ajout d'une image : {{path}}"
    deleteMedia: "Suppression d'une image : {{path}}"

locale: fr
site_url: https://incubateurtech.tech
display_url: https://incubateurtech.tech
logo_url: /favicon.svg

media_folder: content/images
public_folder: /images/uploads

collections:
  - name: articles
    label: Articles du blog
    label_singular: Article
    description: Les articles apparaissent sur la page Blog du site, du plus récent au plus ancien.
    folder: content/articles
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} ({{date}})"
    sortable_fields: [date, title, category]
    preview_path: blog/{{slug}}
    fields:
      - label: Titre
        name: title
        widget: string
      - label: Date de publication
        name: date
        widget: datetime
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        time_format: false
      - label: Catégorie
        name: category
        widget: select
        options: ["Actualités ITI", "Tutoriels", "Conseils Technologiques", "Événements", "Formations"]
        default: "Actualités ITI"
      - label: Auteur
        name: author
        widget: string
        default: "Équipe ITI"
      - label: Image principale
        name: image
        widget: image
        hint: "Format paysage conseillé (par exemple 1200 × 675 px), en JPG ou WebP de moins de 500 Ko."
      - label: Résumé (2 phrases maximum)
        name: excerpt
        widget: text
        hint: "Affiché dans la liste des articles et lors des partages sur WhatsApp ou Facebook."
      - label: Contenu de l'article
        name: body
        widget: markdown
      - label: Publié sur le site
        name: published
        widget: boolean
        default: true
        hint: "Décochez pour garder l'article en brouillon (il ne s'affichera pas)."
