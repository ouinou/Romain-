# Site ITI – incubateurtech.tech
# Netlify publie le dossier site-en-ligne à chaque modification de la branche main.
# Les contenus (articles, formations, FAQ…) ne sont pas ici : ils sont dans la base
# Supabase et se modifient depuis https://incubateurtech.tech/admin, en temps réel.

[build]
  publish = "site-en-ligne"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
