# Site ITI – incubateurtech.tech, hébergé sur Netlify.
# Netlify reconstruit le site à chaque modification de la branche main
# (y compris chaque article publié depuis /admin).

[build]
  command = "npm ci && npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Adresses des pages (servies par les fichiers .html générés)
[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/ceo"
  to = "/ceo.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/formations"
  to = "/formations.html"
  status = 200

[[redirects]]
  from = "/blog"
