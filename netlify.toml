# Site ITI – incubateurtech.tech
# Netlify publie le dossier site-en-ligne à chaque modification de la branche main.
# Pages publiques : générées par outils/site-public/construire.py.
# Espace d'administration : /admin (contenus enregistrés dans la base Supabase).

[build]
  publish = "site-en-ligne"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://msfsvcxmdkcfndosljgi.supabase.co wss://msfsvcxmdkcfndosljgi.supabase.co; frame-src https://www.youtube.com https://www.openstreetmap.org; media-src 'self' https: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

