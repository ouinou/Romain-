<style id="iti-style">
/* Layout : une revue technique — en-tête de marque, rubriques en onglets, une colonne de lecture de 68ch pour les articles. */
:root {
  --ink: #001B4B;          /* bleu du logo ITI */
  --flame: #F2330D;        /* orange du logo ITI */
  --bg: #F7F8FA;
  --paper: #FFFFFF;
  --fg: #14212F;
  --muted: #5A6878;
  --line: #DCE2E9;
  --chip: #EAF0F6;
  --bar-muted: #BFC9D4;
  --on-ink: #FFFFFF;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #9CC3EA; --flame: #FF7449; --bg: #0E1620; --paper: #142130; --fg: #E6ECF2;
    --muted: #9AA9B9; --line: #26384B; --chip: #1C2D40; --bar-muted: #3A4D62; --on-ink: #0E1620;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #9CC3EA; --flame: #FF7449; --bg: #0E1620; --paper: #142130; --fg: #E6ECF2;
  --muted: #9AA9B9; --line: #26384B; --chip: #1C2D40; --bar-muted: #3A4D62; --on-ink: #0E1620;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.6; }
a { color: var(--ink); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--flame); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; }

/* En-tête */
.masthead { border-bottom: 1px solid var(--line); background: var(--paper); }
.masthead .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 14px; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--fg); }
.brand-logo { height: 64px; width: auto; display: block; background: #FFFFFF; border-radius: 6px; padding: 4px 8px; }
.brand-text { font-family: var(--mono); font-size: 12px; line-height: 1.4; color: var(--muted); max-width: 22ch; }
@media (max-width: 480px) { .brand-text { display: none; } .brand-logo { height: 54px; } }
.site-link { font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); padding: 6px 10px; border-radius: 4px; }
.site-link:hover { color: var(--fg); border-color: var(--muted); }

/* Bandeau de titre */
.intro { padding-block: 40px 20px; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--flame); }
.intro h1 { font-family: var(--display); font-weight: 800; font-stretch: 75%; font-size: clamp(40px, 7vw, 76px); line-height: .95; margin: 8px 0 12px; color: var(--fg); text-wrap: balance; letter-spacing: -.01em; }
.intro p { max-width: 60ch; color: var(--muted); margin: 0; font-size: 18px; }

/* Rubriques */
.rubriques { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.rubriques .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.chip { flex: none; font-family: var(--display); font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: var(--paper); color: var(--fg); padding: 7px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.chip .n { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip[aria-pressed="true"] .n { color: var(--on-ink); opacity: .8; }

/* Liste */
.list { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 32px; padding-block: 28px 56px; }
@media (max-width: 820px) { .list { grid-template-columns: minmax(0, 1fr); } }
.feed { display: grid; gap: 20px; align-content: start; min-width: 0; }
.card { display: grid; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 24px; text-decoration: none; color: var(--fg); transition: border-color .15s; }
.card:hover { border-color: var(--ink); }
.card.lead { border-top: 4px solid var(--flame); }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.tag { color: var(--flame); text-transform: uppercase; letter-spacing: .1em; font-weight: 500; }
.card h2 { font-family: var(--display); font-weight: 750; font-stretch: 85%; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.08; margin: 0; text-wrap: balance; }
.card:not(.lead) h2 { font-size: 22px; }
.card p { margin: 0; color: var(--muted); }
.figures { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-top: 8px; border-top: 1px dashed var(--line); }
.figures div { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.figures b { display: block; font-family: var(--display); font-size: 24px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.readmore { font-family: var(--display); font-weight: 700; color: var(--ink); }
.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: 6px; padding: 28px; color: var(--muted); }
.empty strong { color: var(--fg); font-family: var(--display); }

.side { display: grid; gap: 20px; align-content: start; min-width: 0; }
.side section { border-top: 2px solid var(--fg); padding-top: 12px; }
.side h3 { font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px; }
.side p { margin: 0 0 8px; font-size: 15px; color: var(--muted); }
.side .soon { font-family: var(--display); font-weight: 700; color: var(--fg); font-size: 17px; line-height: 1.25; margin-bottom: 6px; }
.status { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 3px; background: var(--chip); color: var(--ink); }
.side ul { margin: 0; padding-left: 18px; font-size: 15px; color: var(--muted); }

/* Article */
.article { padding-block: 28px 64px; }
.back { font-family: var(--display); font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; }
.article header { max-width: 68ch; margin: 18px auto 28px; }
.article h1 { font-family: var(--display); font-weight: 800; font-stretch: 78%; font-size: clamp(34px, 6vw, 60px); line-height: 1; margin: 10px 0 16px; text-wrap: balance; letter-spacing: -.01em; }
.byline { font-family: var(--display); font-size: 15px; color: var(--muted); }
.byline strong { color: var(--fg); }
.content { max-width: 68ch; margin: 0 auto; }
.content > p:first-child { font-size: 20px; line-height: 1.5; border-left: 4px solid var(--flame); padding-left: 16px; }
.content h2 { font-family: var(--display); font-weight: 750; font-stretch: 88%; font-size: 28px; line-height: 1.15; margin: 44px 0 10px; text-wrap: balance; }
.content h3 { font-family: var(--display); font-weight: 700; font-size: 19px; margin: 26px 0 6px; color: var(--ink); }
.content ul { padding-left: 22px; }
.content li { margin-bottom: 6px; }
.content li::marker { color: var(--flame); }
.content a { overflow-wrap: anywhere; }
.chart { margin: 28px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 18px 18px 12px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart figcaption { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 8px; }
.share { max-width: 68ch; margin: 44px auto 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; }
.btn { font-family: var(--display); font-weight: 700; font-size: 15px; padding: 9px 14px; border-radius: 4px; border: 1px solid var(--ink); background: var(--ink); color: var(--on-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.toast { font-family: var(--mono); font-size: 12px; color: var(--muted); }

footer { border-top: 1px solid var(--line); background: var(--paper); }
footer .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-family: var(--display); font-size: 14px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Couverture d'article */
.cover { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; border-radius: 4px; display: block; max-width: 100%; }
.article .cover { max-width: 68ch; margin: 0 auto 28px; aspect-ratio: 16 / 8; }
.content figure.photo { margin: 28px 0; }
.content figure.photo img { width: 100%; height: auto; border-radius: 4px; display: block; }
.content figure.photo figcaption { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px; }
.content blockquote { margin: 24px 0; padding: 4px 0 4px 18px; border-left: 3px solid var(--ink); font-style: italic; }
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.author-btn { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--on-ink); background: var(--flame); border: 0; padding: 7px 12px; border-radius: 4px; cursor: pointer; }

/* Espace auteur */
.admin { padding-block: 28px 72px; display: grid; gap: 22px; }
.admin h1 { font-family: var(--display); font-weight: 800; font-stretch: 78%; font-size: clamp(32px, 5vw, 48px); line-height: 1; margin: 6px 0 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.panel { display: grid; gap: 16px; min-width: 0; }
.row-list { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.row h3 { font-family: var(--display); font-size: 17px; line-height: 1.25; margin: 0 0 4px; }
.row .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .row { grid-template-columns: minmax(0, 1fr); } .row .actions { justify-content: flex-start; } }
.pill { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 3px; text-transform: uppercase; letter-spacing: .06em; }
.pill.pub { background: var(--chip); color: var(--ink); }
.pill.draft { background: var(--flame); color: var(--on-ink); }
.btn.small { font-size: 13px; padding: 6px 10px; }
.btn.warn { background: transparent; color: var(--flame); border-color: var(--flame); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.form { display: grid; gap: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 20px; min-width: 0; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-family: var(--display); font-weight: 700; font-size: 14px; }
.hint { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.form input[type=text], .form input[type=date], .form textarea { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; }
.form textarea { min-height: 120px; resize: vertical; line-height: 1.55; }
.form textarea#f-source { min-height: 420px; font-family: var(--mono); font-size: 14px; }
.form input:focus, .form textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-family: var(--display); font-size: 14px; cursor: pointer; background: var(--bg); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 560px) { .two { grid-template-columns: minmax(0, 1fr); } }
.figs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 6px 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; }
.tool { font-family: var(--display); font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 6px 10px; border-radius: 4px; cursor: pointer; }
.cover-prev { max-width: 280px; border-radius: 4px; display: block; }
.preview-box { border: 1px dashed var(--line); border-radius: 6px; padding: 16px 20px; background: var(--bg); min-width: 0; }
.sticky-actions { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--paper); border-top: 1px solid var(--line); padding: 12px 0 4px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.msg { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.msg.err { color: var(--flame); }
.guide { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; max-width: 76ch; }
.guide h2 { font-family: var(--display); font-size: 22px; margin: 18px 0 6px; }
.guide h2:first-child { margin-top: 0; }
.guide ol, .guide ul { padding-left: 22px; }
.guide code, .syntax code { font-family: var(--mono); font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 3px; }
.syntax { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 16px; font-size: 15px; }
.global-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); font-family: var(--display); font-size: 15px; padding: 10px 16px; border-radius: 4px; z-index: 50; max-width: calc(100% - 32px); }
/* Contenu importé : images, tableaux, zoom */
.content img { max-width: 100%; height: auto; }
.zoomable { cursor: zoom-in; }
.content svg { max-width: 100%; height: auto; }
.table-wrap { overflow-x: auto; margin: 22px 0; border: 1px solid var(--line); border-radius: 6px; }
.content table { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums; }
.content th, .content td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.content th { font-family: var(--display); background: var(--chip); color: var(--fg); }
.content tr:last-child td { border-bottom: 0; }
.zoom { position: fixed; inset: 0; z-index: 60; background: rgba(5, 12, 22, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.zoom img { max-width: 100%; max-height: 82vh; object-fit: contain; background: #FFFFFF; border-radius: 4px; }
.zoom p { color: #E6ECF2; font-family: var(--mono); font-size: 13px; margin: 0; text-align: center; }
.zoom .btn { align-self: flex-end; background: #FFFFFF; color: #001B4B; border-color: #FFFFFF; }
.need { background: var(--chip); border-radius: 6px; padding: 12px 14px; font-size: 15px; }
.tool.imp { background: var(--paper); border-color: var(--ink); color: var(--ink); }
.zoom[hidden], .global-toast[hidden], [hidden] { display: none !important; }
</style>

6J2OgHTypSlaB6P4XvPuPwXujp9xMAAtZ7H+pf/9k=","rubriques":["Scientifique","Entrepreneuriat","Technique","Énergies","Outils techniques","Tutoriels"],"aparaitre":[{"titre":"Les difficultés de l'entrepreneuriat au Tchad dans les métiers techniques","statut":"Étude en cours"}],"articles":[{"id":"a-emploi-tchad","slug":"emploi-tchad-2025-2026","titre":"Emploi au Tchad : ce que disent 1 262 offres publiées en ligne","rubriques":["Scientifique","Entrepreneuriat"],"auteur":"Ing. OUINOU NGASSALA Romain","date":"2026-10-11","resume":"Nous avons analysé les offres d'emploi publiées en ligne au Tchad entre janvier 2025 et septembre 2026 : qui recrute, pour quels profils, où, et ce que cela implique pour la formation.","chiffres":[["1 262","annonces"],["84 %","ONG, ONU, coopération"],["16 %","métiers techniques"],["37 %","à N'Djamena"]],"cover":"","images":{},"source":"","contenu":"\u003cp>\u003cstrong>En vingt et un mois, de janvier 2025 à septembre 2026, 1 262 offres d'emploi concernant le Tchad ont été relayées en ligne. Plus de quatre sur cinq venaient d'ONG, d'agences de l'ONU ou de la coopération. Les métiers techniques n'en représentent qu'une sur six.\u003c/strong>\u003c/p>\n\n\u003cp>Quand on parle d'emploi des jeunes au Tchad, les chiffres manquent presque toujours. On cite le chômage, on évoque les diplômés sans travail, mais on sait rarement qui recrute, pour quels postes et où.\u003c/p>\n\n\u003cp>Une partie de la réponse se trouve dans les annonces publiées sur Internet. Elles ne disent pas tout du marché, loin de là. Mais elles laissent une trace datée, que l'on peut compter et classer. C'est l'exercice que nous avons mené sur les offres relayées par le site lesopportunites.com, complétées par quelques annonces parues dans la presse.\u003c/p>\n\n\u003ch2>Un marché visible tenu par l'humanitaire\u003c/h2>\n\n\u003cp>Sur les 1 262 annonces, 1 060 émanent d'organisations humanitaires ou de développement : ONG internationales (783), ONG nationales (107), agences de l'ONU (84), coopération bilatérale (86). Les entreprises privées, directement ou via des cabinets, n'en publient que 160. Les projets de l'État, 35.\u003c/p>\n\n\u003cp>Les plus gros publieurs sont tous dans ce premier groupe. Catholic Relief Services arrive en tête avec 83 annonces, devant World Vision (77), la GIZ (68), le Conseil norvégien pour les réfugiés (48) et African Parks (46), qui gère notamment le parc de Zakouma.\u003c/p>\n\n\u003cp>Cette domination s'explique. Le Tchad accueille depuis 2023 un afflux massif de réfugiés soudanais à l'Est, et les organisations qui y interviennent recrutent beaucoup, vite, et publient systématiquement leurs offres en ligne. Une PME de N'Djamena, elle, recrute plutôt par le réseau, l'affichage ou la radio. Ce qui est visible en ligne n'est donc pas le reflet fidèle de l'économie : c'est le reflet de ceux qui publient.\u003c/p>\n\n\u003ch2>Comptables, logisticiens, spécialistes du suivi : les profils qui recrutent\u003c/h2>\n\n\u003cp>Le métier le plus demandé n'est ni ingénieur ni médecin. C'est comptable.\u003c/p>\n\n\u003cfigure class=\"chart\" data-chart=\"metiers\">\u003c/figure>\n\n\u003cp>Ces cinq métiers – comptable, logisticien, spécialiste du suivi-évaluation, chef de projet, assistant administratif ou RH – totalisent 478 annonces, soit 38 % du total. Ils ont un point commun : ils font tourner un projet. Il faut quelqu'un pour tenir les comptes, acheter et acheminer le matériel, mesurer les résultats pour le bailleur, coordonner l'équipe. Un programme humanitaire à Adré ou à Farchana a besoin de ces fonctions avant tout le reste.\u003c/p>\n\n\u003cp>Le niveau demandé est plutôt élevé. Les postes de cadre ou de spécialiste représentent 36 % des annonces, ceux d'encadrement 29 %. Les emplois d'exécution (gardiens, agents d'entretien, manutentionnaires) ne dépassent pas 3 %. Ces emplois existent, mais ils se pourvoient sans doute le plus souvent sans passer par une annonce en ligne.\u003c/p>\n\n\u003ch2>Les métiers techniques, minoritaires dans les annonces\u003c/h2>\n\n\u003cp>Sur les 1 262 annonces, 202 concernent un métier technique ou scientifique, soit 16 %. Moins de dix par mois en moyenne.\u003c/p>\n\n\u003cp>Le génie civil arrive en tête (34 annonces), en bonne partie lié aux chantiers humanitaires (abris, points d'eau, latrines). Suivent l'informatique et les réseaux (30), l'environnement et la biodiversité (28), l'agriculture technique et l'élevage (22), la statistique (19) et la mécanique automobile (18). En bas du classement, l'électricité compte 3 annonces, les télécommunications 4 et le pétrole une seule.\u003c/p>\n\n\u003cp>Ce dernier chiffre peut sembler étrange dans un pays producteur de brut. Il tient sans doute au canal : les compagnies pétrolières et leurs sous-traitants ont leurs propres circuits de recrutement, et passent probablement peu par les sites d'annonces généralistes. Ce point mériterait d'être vérifié auprès d'eux.\u003c/p>\n\n\u003cp>Autre constat : en proportion, ce sont les entreprises qui recrutent le plus de techniciens. Le technique pèse 28 % de leurs annonces, contre 13 % chez les ONG internationales. Mais comme ces dernières publient cinq fois plus, elles restent le premier recruteur de techniciens en nombre : 99 des 202 annonces techniques, soit près d'une sur deux.\u003c/p>\n\n\u003cp>Enfin, la courbe ne monte pas. De janvier à septembre, le nombre d'annonces techniques est resté stable (85 en 2025, 87 en 2026), alors que l'ensemble des offres progressait de 12 %.\u003c/p>\n\n\u003ch2>N'Djamena et l'Est, le reste du pays en retrait\u003c/h2>\n\n\u003cp>La capitale concentre 466 annonces, soit 37 % du total. L'Est en compte 314 (25 %), réparties entre Adré (93 annonces citant la ville), Abéché (60), Farchana (54), Goz-Beïda (53) et Iriba (51). Ce sont les villes où se concentre la réponse à la crise soudanaise.\u003c/p>\n\n\u003cp>Ailleurs, les offres se font rares. Le Sud, pourtant très peuplé, n'en totalise que 86, dont 28 à Moundou. La zone du Lac, du Kanem et du Barh-el-Gazel en compte 84, surtout autour de Bol et Baga Sola. Le Centre en a 44. Le Nord, 18 en vingt et un mois.\u003c/p>\n\n\u003cp>Pour un jeune diplômé de Sarh ou de Pala, le constat est simple : l'emploi publié se trouve à N'Djamena ou à l'Est. Rester dans sa province, c'est presque toujours renoncer aux offres visibles en ligne.\u003c/p>\n\n\u003ch2>L'État, premier recruteur hors des sites d'annonces\u003c/h2>\n\n\u003cp>Un chiffre suffit à relativiser tout ce qui précède. La loi de finances 2026 prévoit 2 800 recrutements exceptionnels dans la fonction publique. C'est plus que toutes les annonces relevées en ligne sur vingt et un mois.\u003c/p>\n\n\u003cp>Le détail est parlant. On y trouve 800 maîtres assistants, 400 instituteurs sortis des écoles normales, 300 diplômés de l'INJS, 500 agents des eaux et forêts, 200 agents d'élevage, 100 développeurs informatiques et 500 professionnels de santé, des infirmiers aux techniciens de maintenance biomédicale. À côté, le ministère de l'Éducation nationale a lancé en novembre 2025 un test pour recruter 3 100 enseignants communautaires de niveau 1.\u003c/p>\n\n\u003cp>Ces recrutements ne passent pas par les sites d'annonces, mais par des listes, des concours et des décisions administratives. Ils dessinent pourtant une demande très différente de celle des ONG : enseignement, santé, environnement, numérique.\u003c/p>\n\n\u003cp>L'Office national pour la promotion de l'emploi (ONAPE) cherche, lui, à mieux encadrer le marché. Depuis 2025, ses circulaires imposent une carte de demandeur d'emploi et une autorisation préalable avant la diffusion des offres. Si ces règles sont appliquées, l'ONAPE devrait disposer à terme d'une vue beaucoup plus complète que celle présentée ici. Ces données ne sont pas publiées pour l'instant.\u003c/p>\n\n\u003ch2>Ce que cela dit de la formation\u003c/h2>\n\n\u003cp>Les annonces ne permettent pas, à elles seules, de juger l'adéquation entre formation et emploi. Il faudrait connaître le nombre de diplômés par filière, et ces chiffres ne sont pas publiés. En septembre 2025, une conférence-débat à l'ENSTP sur le chômage des jeunes ingénieurs faisait d'ailleurs ce constat : aucune statistique fiable n'existe sur leur insertion.\u003c/p>\n\n\u003cp>Trois leçons se dégagent malgré tout.\u003c/p>\n\n\u003cp>La première : un diplôme technique ne suffit pas. Le marché visible demande surtout des compétences de gestion, de suivi et de redevabilité envers les bailleurs. Un ingénieur en génie civil qui sait aussi construire un cadre logique, tenir un budget de projet et produire un rapport de suivi a, au vu de ces annonces, davantage de portes ouvertes.\u003c/p>\n\n\u003cp>La deuxième : les compétences d'appui sont transversales. Comptabilité de projet, logistique, gestion de données : elles servent dans toutes les organisations, quel que soit leur secteur. Elles gagneraient à figurer dans les cursus techniques, sous forme de modules courts.\u003c/p>\n\n\u003cp>La troisième : la demande publique annoncée pour 2026 vise des filières précises (santé, enseignement, eaux et forêts, développement informatique). Les établissements qui forment à ces métiers ont là une indication concrète des besoins.\u003c/p>\n\n\u003cp>Ces données ont été construites à partir des annonces publiées, et non d'entretiens. Elles ne disent pas tout du marché. Elles montrent pourtant assez clairement ce que cherchent les recruteurs et où se situent les manques.\u003c/p>\n\n\u003cp>À notre sens, la compétence numérique est aujourd'hui ce qui fait la différence. Maîtriser Excel, les outils spécialisés de son métier et la gestion appliquée n'est plus un plus : c'est devenu une attente de base. Avant de choisir une filière ou une orientation, il vaut donc la peine de regarder ces chiffres pour comprendre comment se présente le marché.\u003c/p>\n\n\u003ch2>Nos recommandations\u003c/h2>\n\n\u003ch3>Aux décideurs publics\u003c/h3>\n\u003cul>\n  \u003cli>Rendre publiques, même sous forme agrégée, les offres enregistrées par l'ONAPE depuis l'entrée en vigueur de l'autorisation préalable. Sans ces données, l'orientation des jeunes se fait à l'aveugle.\u003c/li>\n  \u003cli>Rapprocher les recrutements publics des besoins de formation, en publiant à l'avance les cibles par métier, comme l'a fait la loi de finances 2026.\u003c/li>\n  \u003cli>Soutenir la création d'activité hors de N'Djamena et de l'Est, où les offres publiées sont très rares.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Aux chefs d'établissement\u003c/h3>\n\u003cul>\n  \u003cli>Intégrer aux filières techniques des modules courts de gestion de projet, de suivi-évaluation et d'outils numériques (Excel, logiciels métier).\u003c/li>\n  \u003cli>Suivre l'insertion des diplômés, ne serait-ce qu'avec une enquête simple six mois et un an après la sortie.\u003c/li>\n  \u003cli>Nouer des partenariats de stage avec les ONG et les entreprises qui recrutent, à N'Djamena comme à l'Est.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Aux étudiants\u003c/h3>\n\u003cul>\n  \u003cli>Choisir sa filière en regardant la demande réelle, pas seulement la réputation d'un diplôme.\u003c/li>\n  \u003cli>Construire ses compétences numériques pendant le cursus, sans attendre la fin des études.\u003c/li>\n  \u003cli>Chercher tôt un stage : c'est souvent la première porte d'entrée dans les organisations qui recrutent.\u003c/li>\n\u003c/ul>\n\n\u003ch3>Aux diplômés sans emploi\u003c/h3>\n\u003cul>\n  \u003cli>Suivre des formations courtes qui rendent compétitifs : comptabilité de projet, logistique, suivi-évaluation, Excel. Si vous en avez encore la possibilité, c'est le meilleur investissement à court terme.\u003c/li>\n  \u003cli>S'inscrire à l'ONAPE, désormais demandé aux demandeurs d'emploi.\u003c/li>\n  \u003cli>Ne pas se limiter à un seul site d'annonces ni à une seule ville.\u003c/li>\n\u003c/ul>\n\n\u003cp>\u003cstrong>Et l'entrepreneuriat ?\u003c/strong> Il mérite la même réflexion. Nous menons actuellement une étude sur les difficultés de l'entrepreneuriat au Tchad, en particulier dans les métiers techniques. Ses résultats seront publiés prochainement. D'ici là, prenez le temps de bien évaluer votre projet avant de vous lancer.\u003c/p>\n\n\u003ch2>Comment ces chiffres ont été obtenus\u003c/h2>\n\n\u003cp>Les annonces ont été relevées sur le flux public du site lesopportunites.com pour le Tchad (rubriques « avis de recrutement » et « stages »), du 1\u003csup>er\u003c/sup> janvier 2025 au 30 septembre 2026. Consultation le 11 octobre 2026.\u003c/p>\n\n\u003cp>Sur 1 295 entrées, 33 ont été écartées : doublons, postes hors du Tchad, appels d'offres. Chaque annonce retenue a été classée par domaine, métier, employeur et localité à partir de son intitulé. Le nombre de postes (au moins 1 797) vient du titre quand il est indiqué ; sinon, une annonce au singulier compte pour un poste.\u003c/p>\n\n\u003cp>\u003cstrong>Ce que ces chiffres ne mesurent pas.\u003c/strong> Le recrutement public, l'emploi informel et les embauches par réseau. Les offres publiées sur d'autres sites : un test sur UNjobnet montre qu'une seule de ses 19 offres ouvertes début octobre 2026 figurait dans le corpus. Les embauches effectives, enfin : une annonce n'est pas un recrutement.\u003c/p>\n\n\u003cp>Le classement est automatique et a été relu sur échantillon. Des erreurs ponctuelles restent possibles. La base complète, avec le lien de chaque annonce, est disponible sur demande.\u003c/p>\n\n\u003ch2>Sources\u003c/h2>\n\u003cul>\n  \u003cli>\u003ca href=\"https://www.lesopportunites.com/pays/tchad/feed/\" target=\"_blank\" rel=\"noopener\">lesopportunites.com – flux des offres au Tchad\u003c/a>\u003c/li>\n  \u003cli>\u003ca href=\"https://www.unjobnet.org/fr/emplois/tchad\" target=\"_blank\" rel=\"noopener\">UNjobnet – offres au Tchad\u003c/a>\u003c/li>\n  \u003cli>\u003ca href=\"https://www.alwihdainfo.com/Tchad-voici-la-liste-des-recrutements-exceptionnels-d-agents-de-l-Etat-pour-l-exercice-budgetaire-2026_a147095.html\" target=\"_blank\" rel=\"noopener\">Alwihda Info – liste des recrutements exceptionnels d'agents de l'État pour 2026\u003c/a>\u003c/li>\n  \u003cli>\u003ca href=\"https://www.alwihdainfo.com/tchad-l-onape-renforce-le-controle-des-embauches-et-des-demandes-d-emploi-a145077/\" target=\"_blank\" rel=\"noopener\">Alwihda Info – l'ONAPE renforce le contrôle des embauches et des demandes d'emploi\u003c/a>\u003c/li>\n  \u003cli>\u003ca href=\"https://tchadinfos.com/2025/09/14/enstp-une-conference-debat-sur-les-solutions-au-chomage-des-jeunes-ingenieurs/\" target=\"_blank\" rel=\"noopener\">Tchadinfos – ENSTP : conférence-débat sur le chômage des jeunes ingénieurs (14/09/2025)\u003c/a>\u003c/li>\n  \u003cli>\u003ca href=\"https://tchadinfos.com/?p=364468\" target=\"_blank\" rel=\"noopener\">Tchadinfos – un test lancé pour recruter 3 100 enseignants communautaires de niveau 1 (14/11/2025)\u003c/a>\u003c/li>\n\u003c/ul>"}]}</script>

  s = s.replace(/(^|[\s(])_(.+?)_(?=[\s.,;:!?)]|$)/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md2html(src, images) {
  src = String(src || "").replace(/\r/g, "");
  images = images || {};
  if (src.trim().startsWith("<")) return src.replace(/iti-img:([\w-]+)/g, (m, k) => images[k] || "");
  return src.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
    let m;
    if ((m = b.match(/^\[image:([\w-]+)(?:\|([^\]]*))?\]$/))) {
      const u = images[m[1]];
      return u ? '<figure class="photo"><img src="' + u + '" alt="' + esc(m[2] || "") + '">' + (m[2] ? "<figcaption>" + esc(m[2]) + "</figcaption>" : "") + "</figure>" : "";
    }
    if ((m = b.match(/^\[graphique:(\w+)\]$/))) return '<figure class="chart" data-chart="' + m[1] + '"></figure>';
    const lines = b.split("\n");
    if (lines.length > 1 && lines.every(l => /^\s*\|.*\|\s*$/.test(l))) {
      const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = lines.filter(l => !/^\s*\|[\s:|-]+\|\s*$/.test(l));
      return '<div class="table-wrap"><table><thead><tr>' + cells(body[0]).map(c => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>" +
        body.slice(1).map(r => "<tr>" + cells(r).map(c => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    }
    if (lines.every(l => /^\s*[-•]\s+/.test(l))) return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*[-•]\s+/, "")) + "</li>").join("") + "</ul>";
    if (lines.every(l => /^\s*\d+[.)]\s+/.test(l))) return "<ol>" + lines.map(l => "<li>" + inline(l.replace(/^\s*\d+[.)]\s+/, "")) + "</li>").join("") + "</ol>";
    if (lines.every(l => /^>\s?/.test(l))) return "<blockquote><p>" + lines.map(l => inline(l.replace(/^>\s?/, ""))).join("<br>") + "</p></blockquote>";
    if (/^###\s+/.test(lines[0])) return "<h3>" + inline(lines[0].replace(/^###\s+/, "")) + "</h3>" + (lines.length > 1 ? "<p>" + lines.slice(1).map(inline).join("<br>") + "</p>" : "");
    if (/^##\s+/.test(lines[0])) return "<h2>" + inline(lines[0].replace(/^##\s+/, "")) + "</h2>" + (lines.length > 1 ? "<p>" + lines.slice(1).map(inline).join("<br>") + "</p>" : "");
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  }).join("\n");
}

function chartSVG(key) {

  }).join("");

    insertText(txt);

  });
  $("f-docx").addEventListener("change", async ev => { const f = ev.target.files[0]; ev.target.value = ""; if (f) importDocx(f); });

function msg(t, err) { const m = $("ed-msg"); if (m) { m.textContent = t; m.className = "msg" + (err ? " err" : ""); } }
function insertText(txt) {
  const ta = $("f-source"); const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + txt + ta.value.slice(e); ta.focus();
  ta.selectionStart = ta.selectionEnd = s + txt.length;
}

function addImage(dataUrl) {
  const k = "img" + Object.keys(EDIT.images).length + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 4);
  EDIT.images[k] = dataUrl; return k;
}
async function compress(file, max, q) {
  const isUrl = typeof file === "string";
  const url = isUrl ? file : URL.createObjectURL(file); const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const s = Math.min(1, max / img.naturalWidth); const c = document.createElement("canvas");
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  if (!isUrl) URL.revokeObjectURL(url); return c.toDataURL("image/jpeg", q);
}

/* ---------- import de documents ---------- */
let PENDING_IMPORT = null;
function sanitize(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const root = doc.body;
  let lost = 0;
  root.querySelectorAll("canvas").forEach(c => { lost++; c.remove(); });
  root.querySelectorAll("script,style,link,meta,iframe,object,embed,noscript,form,input,button,select,textarea,nav,header > nav").forEach(el => el.remove());
  root.querySelectorAll("*").forEach(el => {
    Array.from(el.attributes).forEach(a => {
      const n = a.name.toLowerCase();
      if (n.startsWith("on")) el.removeAttribute(a.name);
      else if (n === "style" && !el.closest("svg")) el.removeAttribute(a.name);
      else if ((n === "href" || n === "src" || n === "xlink:href") && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
      else if (n === "class" && !el.closest("svg")) el.removeAttribute(a.name);
      else if (n === "id" && !el.closest("svg")) el.removeAttribute(a.name);
    });
  });
  root.querySelectorAll("h1").forEach(h => { const h2 = doc.createElement("h2"); h2.innerHTML = h.innerHTML; h.replaceWith(h2); });
  return { root, lost };
}
async function finishImport(root, lost, label) {
  const imgs = Array.from(root.querySelectorAll("img"));
  const missing = [];
  for (const im of imgs) {
    const src = im.getAttribute("src") || "";
    if (/^data:image\/(png|jpe?g|gif|webp|bmp)/i.test(src)) {
      try { im.setAttribute("src", "iti-img:" + addImage(await compress(src, 1600, 0.82))); } catch (e) { im.remove(); }
    } else if (/^data:image\/svg/i.test(src) || /^https?:/i.test(src)) {
      if (/^data:/i.test(src)) im.setAttribute("src", "iti-img:" + addImage(src));
    } else if (src) {
      const name = decodeURIComponent(src.split(/[\/\\]/).pop().split("?")[0]);
      im.setAttribute("data-need", name); missing.push(name);
    } else im.remove();
  }
  imgs.forEach(im => { if (!im.closest("figure") && im.parentElement && im.isConnected) { im.setAttribute("alt", im.getAttribute("alt") || ""); } });
  const html = root.innerHTML.replace(/\n{3,}/g, "\n\n").trim();
  $("f-source").value = html;
  if (!$("f-titre").value.trim()) { const t = root.querySelector("h2"); }
  readForm();
  let note = label === "Page HTML" ? "Page HTML importée." : "Document Word importé.";
  if (lost) note += " " + lost + " graphique(s) dessiné(s) par script n'ont pas pu être repris : exportez-les en image (PNG) et ajoutez-les avec « Images dans le texte ».";
  if (missing.length) {
    PENDING_IMPORT = missing;
    const box = $("need-imgs"); box.hidden = false;
    box.innerHTML = "<strong>" + missing.length + " image(s) de ce document sont des fichiers séparés.</strong> Sélectionnez-les ici (elles sont reconnues par leur nom : " + missing.slice(0, 6).map(esc).join(", ") + (missing.length > 6 ? "…" : "") + ').<br><label class="tool imp" for="f-need" style="display:inline-flex;margin-top:8px">Choisir les images</label><input type="file" id="f-need" accept="image/*" multiple hidden>';
    $("f-need").addEventListener("change", async ev => {
      const files = Array.from(ev.target.files || []); let done = 0;
      readForm(); let src = EDIT.source;
      for (const f of files) {
        const re = new RegExp('data-need="' + f.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + '"', "g");
        if (!re.test(src)) continue;
        try {
          const k = addImage(await compress(f, 1600, 0.82));
          src = src.replace(new RegExp('src="[^"]*"([^>]*?)data-need="' + f.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + '"', "g"), 'src="iti-img:' + k + '"$1')
                   .replace(new RegExp('data-need="' + f.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + '"([^>]*?)src="[^"]*"', "g"), '$1src="iti-img:' + k + '"');
          done++;
        } catch (e) {}
      }
      $("f-source").value = src; readForm();
      const left = (src.match(/data-need="/g) || []).length;
      box.innerHTML = done + " image(s) reliée(s)." + (left ? " Il en manque encore " + left + " : choisissez-les à nouveau ou retirez-les du texte." : " Toutes les images sont en place.");
    });
  }
  msg(note, !!lost);
}
async function importHtmlFile(file) {
  readForm(); msg("Import en cours…");
  try {
    const text = await file.text();
    const t = new DOMParser().parseFromString(text, "text/html");
    const title = (t.querySelector("h1") || t.querySelector("title") || {}).textContent;
    if (title && !$("f-titre").value.trim()) $("f-titre").value = title.trim();
    const { root, lost } = sanitize(text);
    const h1 = root.querySelector("h2"); if (h1 && title && h1.textContent.trim() === title.trim()) h1.remove();
    await finishImport(root, lost, "Page HTML");
  } catch (e) { msg("Ce fichier HTML n'a pas pu être lu.", true); }
}
let mammothLoading = null;
function loadMammoth() {
  if (window.mammoth) return Promise.resolve(window.mammoth);
  if (!mammothLoading) mammothLoading = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js";
    s.onload = () => window.mammoth ? res(window.mammoth) : rej(); s.onerror = rej; document.head.appendChild(s);
  });
  return mammothLoading;
}
async function importDocx(file) {
  readForm(); msg("Lecture du document Word…");
  try {
    const mammoth = await loadMammoth();
    const r = await mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() }, {
      convertImage: mammoth.images.imgElement(img => img.read("base64").then(b => ({ src: "data:" + img.contentType + ";base64," + b })))
    });
    const { root, lost } = sanitize("<body>" + r.value + "</body>");
    const first = root.querySelector("h2");
    if (first && !$("f-titre").value.trim()) { $("f-titre").value = first.textContent.trim(); first.remove(); }
    const odd = Array.from(root.querySelectorAll("img")).filter(i => /^data:image\/(x-emf|x-wmf|emf|wmf)/i.test(i.getAttribute("src") || "")).length;
    root.querySelectorAll("img").forEach(i => { if (/^data:image\/(x-emf|x-wmf|emf|wmf)/i.test(i.getAttribute("src") || "")) i.remove(); });
    await finishImport(root, lost + odd, "Document Word");
  } catch (e) { msg("Le document Word n'a pas pu être lu. Vérifiez qu'il s'agit bien d'un fichier .docx.", true); }
}
function readForm() {
  if (!EDIT || !$("f-titre")) return;
  EDIT.titre = $("f-titre").value.trim();
  EDIT.rubriques = STATE.rubriques.filter((r, i) => $("f-r" + i) && $("f-r" + i).checked);
  EDIT.auteur = $("f-auteur").value.trim() || AUTEUR_DEFAUT;
  EDIT.date = $("f-date").value || today();
  EDIT.resume = $("f-resume").value.trim();
  EDIT.source = $("f-source").value;
  EDIT.chiffres = [0, 1, 2, 3].map(i => [$("f-fv" + i).value.trim(), $("f-fl" + i).value.trim()]).filter(c => c[0]);
  const used = EDIT.source;
  Object.keys(EDIT.images).forEach(k => { if (used.indexOf(k) < 0) delete EDIT.images[k]; });
}
async function saveDraftObj(obj) {
  const body = JSON.parse(JSON.stringify(obj)); body.maj = new Date().toISOString();
  const imgs = Object.assign({}, body.images || {});
  if (body.cover && body.cover.startsWith("data:")) { imgs.couv = body.cover; body.cover = "@couv"; }
  body.images = Object.keys(imgs);
  if (JSON.stringify(body).length > 250000) throw { code: "too_large" };
  for (const k of body.images) {
    if (imgs[k].length > 255000) imgs[k] = await compress(imgs[k], 1200, 0.7);
    if (imgs[k].length > 255000) throw { code: "too_large" };
    await DB.doc("images/" + body.id + "__" + k).set({ brouillon: body.id, data: imgs[k] });
  }
  await DB.doc("brouillons/" + body.id).set(body);
}
async function loadDraft(d) {
  const e = fromArticle(d);
  const keys = Array.isArray(d.images) ? d.images : null;
  e.images = keys ? {} : (d.images || {});
  if (keys) for (const k of keys) {
    try { const s = await DB.doc("images/" + d.id + "__" + k).get(); if (s.exists) { if (k === "couv") e.cover = s.data().data; else e.images[k] = s.data().data; } } catch (err) {}
  }
  if (e.cover === "@couv") e.cover = "";
  return e;
}
async function deleteDraft(id) {
  const d = DRAFTS.find(x => x.id === id);
  if (d && Array.isArray(d.images)) for (const k of d.images) { try { await DB.doc("images/" + id + "__" + k).delete(); } catch (e) {} }
  await DB.doc("brouillons/" + id).delete();
}
async function saveDraft() {
  readForm(); if (!DB) return;
  if (!EDIT.titre) { msg("Ajoutez un titre avant d'enregistrer.", true); return; }
  msg("Enregistrement…");
  try { await saveDraftObj(EDIT); msg("Brouillon enregistré à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) + "."); }
  catch (e) { msg(e && e.code === "too_large" ? "Brouillon trop lourd : le texte dépasse la taille permise. Publiez directement, ou coupez l'article en deux." : "Enregistrement impossible pour le moment. Votre texte reste dans l'éditeur.", true); }
}
async function publishEdit() {
  readForm(); const e = EDIT;
  if (!e.titre) { msg("Ajoutez un titre.", true); return; }
  if (!e.rubriques.length) { msg("Cochez au moins une rubrique.", true); return; }
  if (!e.source.trim()) { msg("Le texte de l'article est vide.", true); return; }
  if (!e.resume) e.resume = String(md2html(e.source, {})).replace(/<\/(p|h2|h3|li|blockquote)>/g, " ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim().slice(0, 220) + "…";
  const others = STATE.articles.filter(a => a.id !== e.id);
  let slug = e.slug || slugify(e.titre), n = 2; const base = slug;
  while (others.some(a => a.slug === slug) || slug === "auteur") slug = base + "-" + n++;
  const art = { id: e.id, slug: slug, titre: e.titre, rubriques: e.rubriques, auteur: e.auteur, date: e.date, resume: e.resume, chiffres: e.chiffres, cover: e.cover || "", images: e.images, source: e.source, contenu: md2html(e.source, e.images) };
  const next = Object.assign({}, STATE, { articles: [art].concat(others) });
  ss.set("iti-pending", JSON.stringify(e));
  if (DB && DRAFTS.some(d => d.id === e.id)) { try { await deleteDraft(e.id); } catch (err) {} }
  await publishState(next, "Article publié. Il est en ligne sur la page.", "#" + slug);
}
async function publishState(next, okMsg, hash) {
  if (BUSY) return; BUSY = true;
  if (!ART) { toast("La publication n'est pas disponible dans cette vue."); BUSY = false; return; }
  const btn = $("publish"); if (btn) { btn.disabled = true; btn.textContent = "Publication…"; }
  ss.set("iti-flash", okMsg); if (hash) ss.set("iti-goto", hash);
  try {
    await ART.publish(buildDoc(next));
    ss.del("iti-pending");
  } catch (e) {
    ss.del("iti-flash"); ss.del("iti-goto"); BUSY = false;
    const code = e && e.code;
    if (code === "conflict") { toast("La page a changé entre-temps. Elle se recharge ; votre texte sera rouvert."); return; }
    ss.del("iti-pending");
    if (btn) { btn.disabled = false; btn.textContent = "Publier sur la page"; }
    const m = code === "too_large" ? "Page trop lourde : réduisez la taille ou le nombre des images." : code === "not_writer" || code === "not_granted" ? "Vous n'avez pas les droits de publication dans cette vue." : code === "rate_limited" ? "Trop de publications rapprochées. Réessayez dans une minute." : "La publication a échoué. Votre texte est toujours là, réessayez.";
    msg(m, true); toast(m);
  }
}
